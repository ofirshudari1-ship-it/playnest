<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<!-- lang/dir are set from JS on load/update (see script below) to follow the
     app's current language setting, same as the main window (src/i18n.ts
     setLanguage). Left as en/ltr here only as the pre-JS fallback. -->
<title>Playnest widget</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  .card {
    box-sizing: border-box;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 12px 14px 14px;
    /* Brand gradient under a 45% dark scrim: white text straight on the raw
       gradient measured only 1.88:1 at the teal end (#22d3c5) — well below
       WCAG AA. With the scrim, white is 5.6:1 there and 10:1 at the violet end,
       and 4.5:1+ even for the 85%-white secondary line. */
    background:
      linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
      linear-gradient(135deg, #7c5cff 0%, #22d3c5 100%);
    border-radius: 18px;
    color: #fff;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    -webkit-app-region: drag;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.2px;
    opacity: 0.95;
  }
  .brand img { width: 16px; height: 16px; border-radius: 4px; display: block; }
  .icon-btn {
    -webkit-app-region: no-drag;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: none;
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, 0.3); }

  .streak-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 10px;
  }
  .flame { font-size: 22px; }
  .streak-num { font-size: 30px; font-weight: 800; line-height: 1; }
  .streak-label { font-size: 12px; color: rgba(255, 255, 255, 0.9); }
  .streak-sub { font-size: 11px; color: rgba(255, 255, 255, 0.85); margin-top: 2px; }

  .actions {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .action-btn {
    -webkit-app-region: no-drag;
    border: none;
    border-radius: 9px;
    padding: 8px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    /* start/end (not left) so this mirrors correctly once <html dir="rtl">
       is set from JS for Hebrew — see the language-driven dir attribute set
       on load/update below. */
    text-align: start;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: rgba(255, 255, 255, 0.92);
    color: #4a2fd6;
  }
  .action-btn:hover { background: #fff; }
  .action-btn.secondary {
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
  }
  .action-btn.secondary:hover { background: rgba(255, 255, 255, 0.28); }
  .action-btn:disabled { opacity: 0.55; cursor: default; }

  /* Windows High Contrast (forced colors): drop the gradient/shadow and let
     the user's own system colors through, with real borders on controls. */
  @media (forced-colors: active) {
    .card { background: Canvas; color: CanvasText; box-shadow: none; border: 1px solid CanvasText; }
    .action-btn, .action-btn.secondary, .icon-btn { background: ButtonFace; color: ButtonText; border: 1px solid ButtonText; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="brand">
        <img src="../assets/icon.png" alt="" />
        <span>Playnest</span>
      </div>
      <button class="icon-btn" id="closeBtn" title="Hide widget" aria-label="Hide widget">&#10005;</button>
    </div>

    <div class="streak-row">
      <span class="flame" aria-hidden="true">&#128293;</span>
      <span class="streak-num" id="streakNum">0</span>
      <span class="streak-label" id="streakLabel">day streak</span>
    </div>
    <div class="streak-sub" id="streakSub"></div>

    <div class="actions">
      <button class="action-btn secondary" id="launchBtn" style="display:none"></button>
      <button class="action-btn" id="openBtn">Open Playnest</button>
    </div>
  </div>

  <script>
    const streakNum = document.getElementById('streakNum');
    const streakLabel = document.getElementById('streakLabel');
    const streakSub = document.getElementById('streakSub');
    const launchBtn = document.getElementById('launchBtn');
    const openBtn = document.getElementById('openBtn');
    const closeBtn = document.getElementById('closeBtn');

    // Fallback English strings, used only for the very first paint before the
    // main process's first getData() response lands (see getWidgetData() /
    // main.cjs, which is the single source of truth for these strings —
    // driven by the app's current language setting, same locales/*.json the
    // main window's src/i18n.ts reads).
    const FALLBACK_STRINGS = {
      hide: 'Hide widget',
      dayStreak: 'day streak',
      noStreak: 'Play something today to start a streak',
      longestSummaryTpl: 'Longest: {longest} · {days} active days',
      openPlaynest: 'Open Playnest',
      launchLastTpl: '▶ {name}'
    };

    function fill(tpl, vars) {
      return Object.entries(vars).reduce((s, [k, v]) => s.replace(`{${k}}`, String(v)), tpl);
    }

    function render(data) {
      if (!data) return;

      // Follow the app's current language/direction, exactly like the main
      // window (src/i18n.ts setLanguage) — this window previously never
      // updated lang/dir at all, so Hebrew always rendered LTR here.
      const lang = data.lang === 'he' ? 'he' : 'en';
      document.documentElement.setAttribute('lang', lang);
      document.documentElement.setAttribute('dir', lang === 'he' ? 'rtl' : 'ltr');

      const strings = data.strings || FALLBACK_STRINGS;
      closeBtn.title = strings.hide;
      closeBtn.setAttribute('aria-label', strings.hide);
      openBtn.textContent = strings.openPlaynest;

      const streak = data.streak || { currentStreak: 0, longestStreak: 0, totalActiveDays: 0 };
      const current = streak.currentStreak || 0;
      streakNum.textContent = String(current);
      streakLabel.textContent = strings.dayStreak;
      streakSub.textContent = current === 0
        ? strings.noStreak
        : fill(strings.longestSummaryTpl, { longest: streak.longestStreak, days: streak.totalActiveDays });

      if (data.lastPlayed && data.lastPlayed.name) {
        launchBtn.style.display = '';
        launchBtn.textContent = fill(strings.launchLastTpl, { name: data.lastPlayed.name });
        launchBtn.disabled = false;
      } else {
        launchBtn.style.display = 'none';
      }
    }

    openBtn.addEventListener('click', () => window.playnestWidget.openPlaynest());
    closeBtn.addEventListener('click', () => window.playnestWidget.hide());
    launchBtn.addEventListener('click', () => {
      launchBtn.disabled = true;
      window.playnestWidget.launchLastPlayed().finally(() => { launchBtn.disabled = false; });
    });

    window.playnestWidget.getData().then(render);
    window.playnestWidget.onUpdate(render);
  </script>
</body>
</html>
