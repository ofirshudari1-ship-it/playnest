<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .card {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    /* Shared cross-product brand identity (STANDARDS.md §21 — "IObit-style"
       unified installer+splash across OptiGuard/Playnest/ActionClip/SnapCap):
       same dark base + accent-blue gradient and same border/glow color in
       every tool's splash, so users immediately recognize one company made
       all of them. Only the icon inside stays product-specific.
       Same dark-scrim technique as widget.html, tuned to 55%: #EAEAEA text
       straight on the raw gradient measures only ~3.8:1 at the #2F6FED end
       (below WCAG AA 4.5:1 for normal text), and the muted #94A3B8 .version
       label fares worse still. A 55% scrim clears 4.5:1+ for both across the
       whole gradient (8.6:1 / 4.8:1 at the #2F6FED end, higher elsewhere). */
    background:
      linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
      linear-gradient(135deg, #0B1220 0%, #2F6FED 100%);
    border: 1px solid #1E2A45;
    border-radius: 16px;
    color: #EAEAEA;
    -webkit-app-region: drag;
  }
  img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 0 0 2px #2F6FED, 0 8px 24px rgba(0,0,0,0.35); }
  h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: 0.2px; color: #EAEAEA; }
  .spinner {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 3px solid rgba(234,234,234,0.25);
    border-top-color: #5B9AFF;
    animation: spin 0.8s linear infinite;
  }
  .version { position: absolute; bottom: 10px; font-size: 11px; color: #94A3B8; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 1.6s; } }
  @media (forced-colors: active) {
    .card { background: Canvas; color: CanvasText; border: 1px solid CanvasText; }
    img { box-shadow: none; }
    .version { color: CanvasText; }
    .spinner { border-color: GrayText; border-top-color: Highlight; }
  }
</style>
</head>
<body>
  <div class="card">
    <img src="../assets/icon.png" alt="" />
    <h1>Playnest</h1>
    <div class="spinner" role="status" aria-label="Loading"></div>
    <span class="version" id="version"></span>
  </div>
  <script>
    // versionText is injected by main.cjs via executeJavaScript after load.
  </script>
</body>
</html>
