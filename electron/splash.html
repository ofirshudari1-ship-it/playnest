<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .card {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    /* Same brand gradient + dark scrim as widget.html, so the white title and
       version text clear WCAG AA contrast across the whole gradient. */
    background:
      linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
      linear-gradient(135deg, #7c5cff 0%, #22d3c5 100%);
    border-radius: 16px;
    color: #fff;
    -webkit-app-region: drag;
  }
  img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
  h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: 0.2px; }
  .spinner {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    animation: spin 0.8s linear infinite;
  }
  .version { position: absolute; bottom: 10px; font-size: 11px; color: rgba(255,255,255,0.85); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 1.6s; } }
  @media (forced-colors: active) {
    .card { background: Canvas; color: CanvasText; border: 1px solid CanvasText; }
    img { box-shadow: none; }
    .version { color: CanvasText; }
    .spinner { border-color: GrayText; border-top-color: Highlight; }
  }
</style>
</head>
<body>
  <div class="card">
    <img src="../assets/icon.png" alt="" />
    <h1>Playnest</h1>
    <div class="spinner" role="status" aria-label="Loading"></div>
    <span class="version" id="version"></span>
  </div>
  <script>
    // versionText is injected by main.cjs via executeJavaScript after load.
  </script>
</body>
</html>
